<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin Menu | Vare.</title>
<link rel="icon" type="image/webp" href="assets/img/logo.webp">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<header><div class="wrap">
<a href="/" aria-label="Kembali ke website"><img class="logo" src="assets/img/logo.webp" alt="Vare. Coffee &amp; More"></a>
<nav><a href="/">Kembali ke website</a>
<button id="theme" aria-label="Ganti mode gelap/terang" title="Ganti tema"><span class="ti sun"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="ti moon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></button></nav>
</div></header>
<main class="adm">
<h1 class="serif">Kelola Menu</h1>
<p class="note">Ubah menu di sini, klik <b>Unduh menu.json</b>, lalu timpa file <code>data/menu.json</code> di repo dan commit. Vercel akan otomatis memperbarui website. Halaman ini hanya menyiapkan file; perubahan tidak langsung tampil di website. Draf tersimpan di browser ini.</p>
<div id="msg" class="note" role="status"></div>
<div id="list"></div>
<div class="adm-bar">
<button class="btn ghost" id="add">+ Tambah item</button>
<button class="btn" id="download">Unduh menu.json</button>
<button class="btn ghost" id="copy">Salin JSON</button>
<button class="btn ghost" id="reset">Muat ulang dari file</button>
</div>
<details><summary>Pratinjau JSON</summary><textarea id="preview" readonly aria-label="Pratinjau JSON"></textarea></details>
</main>
<script type="module" src="js/admin.js"></script>
</body>
</html>
